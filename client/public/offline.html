<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d7377">
<title>오래 · 연결 없음</title>
<style>
  :root { --accent:#0d7377; --ink:#111827; --sub:#6b7280; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#fafafb; color:var(--ink); padding:24px;
         font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .card { width:100%; max-width:360px; background:#fff; border:1px solid var(--line); border-radius:16px;
          padding:32px 24px; text-align:center; }
  img { width:64px; height:64px; border-radius:14px; }
  h1 { font-size:18px; margin:20px 0 8px; }
  p { font-size:14px; line-height:1.6; color:var(--sub); margin:0 0 24px; }
  button { appearance:none; border:1px solid var(--line); background:#fff; color:var(--accent);
           font:inherit; font-weight:600; font-size:15px; padding:12px 20px; border-radius:10px; width:100%; }
</style>
</head>
<body>
  <div class="card">
    <img src="/pwa-192.png" alt="">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
